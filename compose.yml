version: "3.9"

services:
  devopsdb:
    image: modasai/dockerfbapp
    ports:
      - "3306:3306"
    deploy:
      replicas: 2
    networks:
      - "my_network"

  application:
    image: modasai/dockerfbdb
    ports:
      - "1111:8080"
    deploy:
      replicas: 2
    networks:
      - "my_network"
    depends_on:
      - "devopsdb"

networks:
  my_network:
    driver: "overlay"

